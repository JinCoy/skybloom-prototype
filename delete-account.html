<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skybloom · 계정 삭제</title>
<meta name="robots" content="noindex">
<!-- B7 web deletion link (Google Play asks for one outside the app). Same deletion as the game's Settings -> Delete Account & Data (auth.js deleteAccount). -->
<style>
  :root { --bg: #eaf6ff; --card: #ffffff; --ink: #14315c; --sub: #4a6488; --line: #c9def4; --blue: #2f7fe0; --red: #c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1b2d; --card: #182a44; --ink: #e8f1ff; --sub: #a9bfdc; --line: #2b4466; --blue: #6aa8ff; --red: #ff7a6b; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 8px; } h2 { font-size: 17px; margin: 24px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 16px; }
  ul { padding-left: 20px; margin: 8px 0; } p { margin: 8px 0; } .sub { color: var(--sub); font-size: 14px; }
  button { font: 600 16px system-ui, sans-serif; border-radius: 10px; padding: 12px 18px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; width: 100%; margin-top: 10px; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; } button.danger { background: var(--red); border-color: var(--red); color: #fff; }
  button:disabled { opacity: .5; cursor: default; } label { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; } [hidden] { display: none !important; }
  #msg { margin-top: 12px; font-weight: 600; } a { color: var(--blue); }
</style>
</head>
<body>
<main>
  <h1 data-t="title"></h1>
  <p class="sub" data-t="lead"></p>
  <div class="card">
    <h2 data-t="whatH"></h2>
    <ul><li data-t="what1"></li><li data-t="what2"></li><li data-t="what3"></li></ul>
    <h2 data-t="guestH"></h2>
    <p data-t="guest"></p>
  </div>
  <div class="card" id="step1">
    <p data-t="signIn"></p>
    <button class="primary" id="google" data-t="google"></button>
    <button id="apple" data-t="apple" hidden></button>
  </div>
  <div class="card" id="step2" hidden>
    <p><span data-t="signedAs"></span> <b id="who"></b></p>
    <label><input type="checkbox" id="sure"> <span data-t="sure"></span></label>
    <button class="danger" id="del" disabled data-t="del"></button>
  </div>
  <p id="msg" role="status"></p>
  <p class="sub"><span data-t="help"></span> <a href="mailto:privacy@dreamhum.com">privacy@dreamhum.com</a></p>
</main>
<script src="firebase-config.js?v=0.7.66"></script>
<script src="auth.js?v=0.7.66"></script>
<script>
  const T = {
    ko: { title: 'Skybloom 계정·데이터 삭제', lead: 'Google(또는 Apple) 계정으로 로그인한 Skybloom 계정과 데이터를 여기서 삭제할 수 있어요. 게임 안에서는 설정 → 계정·데이터 삭제에서 할 수 있어요.',
      whatH: '삭제되는 것', what1: '계정 (로그인 연결)', what2: '서버에 저장된 도감·보물·장착 스킨·꾸미기·설정', what3: '이 브라우저에 저장된 게임 기록과 플레이 기록',
      guestH: '게스트로 플레이했다면', guest: '게스트 계정은 그 기기에만 연결돼 있어서 여기서는 찾을 수 없어요. 그 기기의 게임에서 설정 → 계정·데이터 삭제를 눌러 주세요. 게임을 이미 지웠다면 아래 메일로 알려 주세요.',
      signIn: '본인 확인을 위해 게임에서 쓰던 계정으로 로그인해 주세요.', google: 'Google로 로그인', apple: 'Apple로 로그인', signedAs: '로그인한 계정:',
      sure: '삭제하면 되돌릴 수 없고, 구매한 스킨도 함께 사라진다는 것을 이해했어요.', del: '계정과 데이터 삭제', working: '삭제하는 중…', done: '삭제했어요. 이용해 주셔서 고마워요.',
      failed: '삭제하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.', unavailable: '이 주소에서는 로그인을 쓸 수 없어요.', popup: '팝업이 차단됐어요. 이 사이트의 팝업을 허용한 뒤 다시 눌러 주세요.', cancelled: '로그인이 취소됐어요.', help: '도움이 필요하면:' },
    en: { title: 'Delete your Skybloom account and data', lead: 'Delete a Skybloom account you signed in to with Google (or Apple), together with its data. In the game: Settings → Delete Account & Data.',
      whatH: 'What is deleted', what1: 'Your account (the sign-in link)', what2: 'Your collection, treasures, equipped skins, Decorate layout and settings on our server', what3: 'Game data and the play log saved in this browser',
      guestH: 'If you played as a guest', guest: 'A guest account belongs to one device, so it cannot be found here. Open the game on that device and go to Settings → Delete Account & Data. If you already removed the game, email us below.',
      signIn: 'To confirm it is you, sign in with the account you used in the game.', google: 'Sign in with Google', apple: 'Sign in with Apple', signedAs: 'Signed in as',
      sure: 'I understand this cannot be undone and purchased skins are lost too.', del: 'Delete account and data', working: 'Deleting…', done: 'Deleted. Thank you for playing.',
      failed: "Couldn't delete. Check your connection and try again.", unavailable: 'Sign-in is not available at this address.', popup: 'The sign-in popup was blocked. Allow popups for this site, then tap again.', cancelled: 'Sign-in was cancelled.', help: 'Need help?' } };
  const L = (navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en', t = k => T[L][k];
  document.documentElement.lang = L; document.title = t('title');
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
  const $ = id => document.getElementById(id), msg = s => { $('msg').textContent = s; };
  if (!SkyAuth.serverConnected) { $('step1').hidden = true; msg(t('unavailable')); }
  if (window.SKY_FIREBASE && SKY_FIREBASE.apple) $('apple').hidden = false;
  const signIn = pv => SkyAuth.signIn(pv, { fresh: true }).then(u => {   // a fresh sign-in, opened right in the tap (the SDK is preloaded); never linked to a guest of the game on this browser
    $('who').textContent = u.email || u.name || u.provider; $('step1').hidden = true; $('step2').hidden = false; msg('');
  }, e => msg(e && e.code === 'cancelled' ? t('cancelled') : e && e.code === 'popup-blocked' ? t('popup') : t('failed')));
  $('google').onclick = () => signIn('google'); $('apple').onclick = () => signIn('apple');
  $('sure').onchange = () => { $('del').disabled = !$('sure').checked; };
  $('del').onclick = async () => {
    $('del').disabled = true; msg(t('working'));
    try { await SkyAuth.deleteAccount(); $('step2').hidden = true; msg(t('done')); }
    catch (e) { $('del').disabled = false; msg(e && e.code === 'cancelled' ? t('cancelled') : e && e.code === 'popup-blocked' ? t('popup') : t('failed')); }
  };
</script>
</body>
</html>
